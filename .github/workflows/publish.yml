name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish to VS Code Marketplace and Open VSX
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --oidc --no-dependencies --skip-duplicate --target win32-x64 win32-arm64 linux-x64

      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT secret not set; skipping Open VSX"; exit 0; fi
          for t in win32-x64 win32-arm64 linux-x64; do
            npx --yes @vscode/vsce package --no-dependencies --target "$t" -o "super-agent-$t.vsix"
            npx --yes ovsx publish "super-agent-$t.vsix" --skip-duplicate
          done
